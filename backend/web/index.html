<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Vertext Live</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap');
:root{--red:#ff2d2d;--dark:#080808;--panel:#101010;--border:#1c1c1c;--text:#e0e0e0;--muted:#444}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--dark);color:var(--text);font-family:'DM Mono',monospace;display:flex;flex-direction:column;min-height:100vh}

header{display:flex;align-items:center;justify-content:space-between;padding:13px 28px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.85rem;letter-spacing:4px;color:#fff}.logo em{color:var(--red);font-style:normal}
.badge{display:flex;align-items:center;gap:7px;background:var(--red);color:#fff;font-size:.62rem;letter-spacing:3px;padding:4px 13px;border-radius:2px;opacity:0;transition:opacity .35s}
.badge.on{opacity:1}.dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:bl 1.1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}

main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}

.stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#vid{width:100%;height:100%;object-fit:contain;display:none}
.hold{display:flex;flex-direction:column;align-items:center;gap:18px;color:var(--muted)}
.hold svg{opacity:.2}
.hold h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;color:#fff;opacity:.25}
.hold p{font-size:.72rem;letter-spacing:2px;text-transform:uppercase}
.ov{position:absolute;bottom:16px;left:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);padding:6px 14px;border-radius:3px;font-size:.73rem;display:none}
.ov.on{display:block}.ov strong{color:var(--red);margin-right:6px}

.sb{border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);overflow-y:auto}
.sec{padding:20px;border-bottom:1px solid var(--border)}
.lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:13px}

.pin-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:16px}
.pd{aspect-ratio:1;background:var(--dark);border:1px solid var(--border);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:1.35rem;text-align:center;border-radius:3px;outline:none;width:100%;transition:border-color .2s}
.pd:focus{border-color:var(--red)}

.btn{width:100%;padding:11px;border:none;border-radius:3px;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;cursor:pointer;transition:opacity .18s}
.btn-w{background:var(--red);color:#fff}.btn-d{background:var(--border);color:var(--text);margin-top:8px}
.btn:hover:not(:disabled){opacity:.82}.btn:disabled{opacity:.35;cursor:not-allowed}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:var(--dark);border:1px solid var(--border);border-radius:3px;padding:10px;text-align:center}
.sv{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;color:#fff;line-height:1}
.sl{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
#vcnt{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--red)}

.log-w{flex:1;overflow-y:auto;padding:12px 20px;min-height:80px}
.le{font-size:.68rem;padding:3px 0;border-bottom:1px solid #111;color:var(--muted)}
.le.ok{color:#3ddb6a}.le.er{color:var(--red)}.le.in{color:#4ab3ff}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--red);color:#fff;padding:10px 24px;border-radius:3px;font-size:.8rem;transition:transform .3s;z-index:99;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:680px){main{grid-template-columns:1fr;grid-template-rows:45vw 1fr}.sb{border-left:none;border-top:1px solid var(--border)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>
<header>
  <div class="logo">VERT<em>EX</em>T LIVE</div>
  <div class="badge" id="badge"><div class="dot"></div>LIVE</div>
</header>
<main>
  <div class="stage">
    <video id="vid" autoplay playsinline></video>
    <div class="hold" id="hold">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="2" y="7" width="20" height="13" rx="2"/>
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
      </svg>
      <h2>VERTEXT LIVE</h2>
      <p>Enter your 8-digit PIN to watch</p>
    </div>
    <div class="ov" id="ov"><strong>LIVE</strong><span id="ovRoom"></span></div>
  </div>

  <div class="sb">
    <div class="sec">
      <div class="lbl">8-Digit Stream PIN</div>
      <div class="pin-grid">
        <input class="pd" id="d0" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d1" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d2" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d3" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d4" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d5" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d6" maxlength="1" inputmode="numeric"/>
        <input class="pd" id="d7" maxlength="1" inputmode="numeric"/>
      </div>
      <button class="btn btn-w" id="watchBtn" onclick="watchStream()">Watch Live</button>
      <button class="btn btn-d" id="discBtn" onclick="disconnect()" disabled>Leave Stream</button>
    </div>

    <div class="sec">
      <div class="lbl">Stream Info</div>
      <div class="stats">
        <div class="stat"><div class="sv" id="sRes">–</div><div class="sl">Resolution</div></div>
        <div class="stat"><div class="sv" id="sFps">–</div><div class="sl">FPS</div></div>
        <div class="stat"><div class="sv" id="sBw">–</div><div class="sl">Kbps</div></div>
        <div class="stat"><div class="sv" id="sLat">–</div><div class="sl">Latency ms</div></div>
      </div>
    </div>

    <div class="sec">
      <div class="lbl">Watching Now</div>
      <div id="vcnt">0</div>
    </div>

    <div class="lbl" style="padding:14px 20px 4px">Activity</div>
    <div class="log-w" id="logW"></div>
  </div>
</main>
<div class="toast" id="toastEl"></div>

<script>
// Backend URL is same origin (served by FastAPI)
const WS_BASE = location.origin.replace('https://', 'wss://').replace('http://', 'ws://');

let pc = null, ws = null, statsItv = null, viewerCount = 0;

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

// PIN digit UX
const digits = Array.from({length:8},(_,i)=>document.getElementById('d'+i));
digits.forEach((el,i)=>{
  el.addEventListener('input',e=>{
    const v=e.target.value.replace(/\D/g,'');
    e.target.value=v.slice(-1);
    if(v&&i<7)digits[i+1].focus();
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!el.value&&i>0)digits[i-1].focus();
    if(e.key==='Enter')watchStream();
  });
  el.addEventListener('paste',e=>{
    e.preventDefault();
    const p=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
    p.slice(0,8).split('').forEach((ch,j)=>{if(digits[i+j])digits[i+j].value=ch;});
    digits[Math.min(i+p.length,7)].focus();
  });
});

function getPin(){return digits.map(d=>d.value).join('');}
function clearPin(){digits.forEach(d=>d.value='');digits[0].focus();}

function toast(msg){
  const el=document.getElementById('toastEl');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}
function log(msg,type=''){
  const a=document.getElementById('logW');
  const el=document.createElement('div');
  el.className='le '+type;
  el.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  a.prepend(el);
}

async function watchStream(){
  const pin=getPin();
  if(pin.length<8){toast('Enter all 8 digits');return;}

  document.getElementById('watchBtn').disabled=true;
  log('Validating PIN...','in');

  try{
    // Validate PIN first
    const res=await fetch('/pin/validate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin})
    });
    if(!res.ok){const e=await res.json();throw new Error(e.detail);}
    const data=await res.json();
    log('PIN valid — room: '+data.room,'ok');
    document.getElementById('ovRoom').textContent=data.room;
    await connectWebRTC(pin);
  }catch(e){
    log('Error: '+e.message,'er');
    toast('Invalid PIN — try again');
    document.getElementById('watchBtn').disabled=false;
  }
}

async function connectWebRTC(pin){
  log('Connecting to stream...','in');

  // Connect WebSocket signaling
  ws = new WebSocket(`${WS_BASE}/ws/${pin}/viewer`);

  pc = new RTCPeerConnection({iceServers: ICE_SERVERS});

  // When we get the remote stream
  pc.ontrack = (e) => {
    const vid = document.getElementById('vid');
    vid.srcObject = e.streams[0];
    vid.style.display = 'block';
    document.getElementById('hold').style.display = 'none';
    document.getElementById('badge').classList.add('on');
    document.getElementById('ov').classList.add('on');
    log('Stream live!','ok');
    startStats();
  };

  // Send ICE candidates to streamer via signaling
  pc.onicecandidate = (e) => {
    if(e.candidate && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({type:'ice', candidate: e.candidate}));
    }
  };

  pc.onconnectionstatechange = () => {
    log('Connection: '+pc.connectionState, pc.connectionState==='connected'?'ok':'');
    if(pc.connectionState==='disconnected'||pc.connectionState==='failed'){
      log('Stream disconnected','er');
      resetUI();
    }
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);

    if(msg.type === 'offer'){
      await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({type:'answer', sdp: answer}));
      log('WebRTC handshake complete','ok');
    }
    else if(msg.type === 'ice'){
      try{ await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }catch(_){}
    }
    else if(msg.type === 'streamer_left'){
      log('Streamer ended the stream','er');
      resetUI();
    }
    else if(msg.type === 'viewer_count'){
      viewerCount = msg.count;
      document.getElementById('vcnt').textContent = viewerCount;
    }
  };

  ws.onopen = () => log('Signaling connected','ok');
  ws.onerror = () => { log('Signaling error','er'); toast('Connection error'); };
  ws.onclose = () => log('Signaling closed','');

  document.getElementById('discBtn').disabled = false;
}

function disconnect(){
  pc?.close(); pc=null;
  ws?.close(); ws=null;
  clearInterval(statsItv);
  resetUI();
  clearPin();
}

function resetUI(){
  document.getElementById('vid').style.display='none';
  document.getElementById('hold').style.display='flex';
  document.getElementById('badge').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
  document.getElementById('watchBtn').disabled=false;
  document.getElementById('discBtn').disabled=true;
  clearInterval(statsItv);
}

function startStats(){
  let lastB=0;
  statsItv=setInterval(async()=>{
    if(!pc)return;
    try{
      const stats=await pc.getStats();
      stats.forEach(s=>{
        if(s.type==='inbound-rtp'&&s.kind==='video'){
          const bw=Math.round(((s.bytesReceived-lastB)*8)/1000);
          lastB=s.bytesReceived;
          if(bw>0)document.getElementById('sBw').textContent=bw;
          document.getElementById('sFps').textContent=Math.round(s.framesPerSecond||0);
          if(s.frameWidth)document.getElementById('sRes').textContent=s.frameWidth+'p';
        }
        if(s.type==='candidate-pair'&&s.state==='succeeded')
          document.getElementById('sLat').textContent=Math.round(s.currentRoundTripTime*1000);
      });
    }catch(_){}
  },2000);
}
</script>
</body>
</html>
