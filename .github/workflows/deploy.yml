name: Vertext Live — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.2

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias vertext \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore vertext.keystore \
            -storepass vertext123 \
            -keypass vertext123 \
            -dname "CN=Vertext Live, OU=Mobile, O=Vertext, L=Nairobi, ST=Nairobi, C=KE"
          mv vertext.keystore android/app/vertext.keystore

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: vertext.keystore
          KEYSTORE_PASSWORD: vertext123
          KEY_ALIAS: vertext
          KEY_PASSWORD: vertext123

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vertext-live-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
